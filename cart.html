    <h1 class="cart-page-title">Cart</h1>
    <div class="cart-wrapper">

        <!-- Right Column: Checkout Form Wrapper -->
        <div class="checkout-wrapper">
            <form class="checkout-form" id="checkout-form">
                <div class="form-group">
                    <label for="student-email">University Email</label>
                    <input type="email" id="student-email" placeholder="e.g., student@nust.edu.pk" 
                    pattern=".+@nust.edu.pk" title="Please enter an email address ending in @nust.edu.pk" required>
                </div>

                <div class="form-group">
                    <label for="return-date">Return Date</label>
                    <input type="date" id="return-date" required>
                </div>

                <!-- logic not implemented yet! -->
                <!-- <div class="verification-group">

                    </div>
                    <button type="button" class="btn-verify">Verify</button>
                </div> -->
                <button type="submit" class="checkout-submit-btn">Checkout</button>
            </form>
        </div>
